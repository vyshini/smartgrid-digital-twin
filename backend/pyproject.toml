[project]
name = "smart-grid-digital-twin-backend"
version = "0.2.0"
description = "Quantum-AI Digital Twin for Indian Smart Grid — Backend (Phase 2: auth, city/grid models)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
